<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ZONA 33 · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#E0433A;--red2:#7C1F1B;--bg:#050505;--panel:#0d0d0d;--panel2:#121212;--line:#292929;--text:#F8F7F8;--muted:#99a0aa;--ok:#5ee5a1;--warn:#f0c75c;--bad:#ff8b91}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.brand{display:inline-flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{font:900 28px/.9 'Barlow Condensed';letter-spacing:.04em}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0,rgba(224,67,58,.2),transparent 32%),var(--bg)}.auth-card{width:min(540px,94vw);background:linear-gradient(145deg,#131313,#090909);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.ey{font:900 11px/1 'Barlow Condensed';color:var(--red);letter-spacing:.18em;text-transform:uppercase}.auth h1{font:900 clamp(54px,9vw,78px)/.86 'Barlow Condensed';text-transform:uppercase;margin:16px 0}.muted{color:var(--muted);font-size:13px;line-height:1.65}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#9299a2}.field input,.field select,.field textarea{width:100%;padding:12px;background:#080808;color:#fff;border:1px solid #343434;border-radius:9px;outline:none}.field textarea{min-height:110px;resize:vertical}.btn{min-height:46px;border-radius:9px;border:1px solid #3b3b3b;background:#181818;color:#fff;padding:11px 14px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.btn.red{background:var(--red);border-color:var(--red)}.btn.out{background:transparent}.btn.danger{background:#2a0d11;border-color:#642029;color:#ff9298}.notice{background:#151515;border:1px solid #2c2c2c;border-left:3px solid var(--red);border-radius:9px;padding:12px;font-size:12px;line-height:1.55;color:#cbd0d7}
.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{position:sticky;top:0;height:100vh;background:#080808;border-right:1px solid #222;padding:16px 12px;display:flex;flex-direction:column}.side .brand{padding:10px 11px;margin-bottom:12px}.side .brand img{width:36px;height:36px}.side .brand strong{font-size:25px}.role{margin:0 11px 12px;color:var(--red);font:900 10px/1 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase}.nav{display:grid;gap:4px;overflow:auto}.nav button{border:0;background:transparent;color:#aeb4bd;padding:11px 12px;text-align:left;border-radius:8px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.nav button:hover,.nav button.active{background:#161616;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--red)}.sidefoot{margin-top:auto;padding:10px 11px;color:#777;font-size:10px;line-height:1.5}.main{min-width:0}.top{height:72px;position:sticky;top:0;z-index:20;background:rgba(5,5,5,.95);backdrop-filter:blur(14px);border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 22px}.top h1{font:900 31px/.9 'Barlow Condensed';text-transform:uppercase;margin:3px 0}.top-actions{display:flex;align-items:center;gap:8px}.content{padding:24px}.grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(145deg,#111,#090909);border:1px solid var(--line);border-radius:13px;padding:18px}.card h2,.card h3{font:900 28px/.9 'Barlow Condensed';text-transform:uppercase;margin:4px 0 12px}.stat small{display:block;color:#888;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.stat b{display:block;font:900 44px/.9 'Barlow Condensed';margin-top:7px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;text-transform:uppercase}.ok{color:var(--ok);background:#0d1c15;border:1px solid #214b36}.warn{color:var(--warn);background:#211c0b;border:1px solid #544716}.bad{color:var(--bad);background:#2a0d11;border:1px solid #642029}.list{display:grid;gap:8px}.item{background:#0b0b0b;border:1px solid #242424;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{font-size:12px}.item small{display:block;color:#888;margin-top:3px}.table-wrap{overflow:auto;border:1px solid #262626;border-radius:10px}.tbl{width:100%;border-collapse:collapse;min-width:760px}.tbl th,.tbl td{padding:10px 11px;border-bottom:1px solid #222;text-align:left;font-size:11px;vertical-align:middle}.tbl th{color:#858b95;background:#0b0b0b;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:#737a84;border:1px dashed #343434;border-radius:9px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modalbox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101010;border:1px solid #2a2a2a;border-radius:14px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{font:900 32px/.9 'Barlow Condensed';text-transform:uppercase;margin:0}.toast{position:fixed;right:18px;bottom:18px;z-index:120;display:none;max-width:380px;background:#111;color:#fff;border:1px solid #333;border-left:3px solid var(--red);border-radius:9px;padding:12px 14px;box-shadow:0 15px 40px #000}.toast.show{display:block}.mobilebar{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.top{height:66px;padding:0 14px}.content{padding:15px}.grid2,.grid3,.row{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(0,0,0,.96);border-top:1px solid #222;padding:9px;gap:7px}.mobilebar button{flex:1}.top-actions .pill{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div>
<script src="./app.js"></script>
</body>
</html>
